name: Monthly One Call Report

on:
  # Run on the 1st of every month at 7:00 AM Central (13:00 UTC)
  schedule:
    - cron: "0 13 1 * *"

  # Allow manual runs from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug secrets presence
        env:
          GOOGLE_TOKEN_PICKLE: ${{ secrets.GOOGLE_TOKEN_PICKLE }}
        run: |
          if [ -z "$GOOGLE_TOKEN_PICKLE" ]; then
            echo "❌ GOOGLE_TOKEN_PICKLE is EMPTY or not set"
          else
            echo "✅ GOOGLE_TOKEN_PICKLE is set (length: ${#GOOGLE_TOKEN_PICKLE})"
          fi

      - name: Run monthly report
        env:
          GOOGLE_TOKEN_PICKLE: ${{ secrets.GOOGLE_TOKEN_PICKLE }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SENDER_EMAIL: ${{ secrets.EMAIL_ADDRESS }}
          SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: python run_monthly_report.py

      - name: Upload reports as artifacts (optional backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-reports-${{ github.run_id }}
          path: Reports/
          retention-days: 90
